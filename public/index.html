<!DOCTYPE html>
<html>
<head><title>URL Shortener - CodeAlpha</title>
<style>
body{font-family: sans-serif; max-width: 500px; margin: 80px auto; text-align:center}
input{width: 100%; padding: 12px; margin: 10px 0}
button{padding: 12px 20px; background: black; color: white; border:0; cursor:pointer}
#result{margin-top:20px; word-break: break-all}
</style>
</head>
<body>
<h2>ZAKIAT URL Shortener</h2>
<input id="longUrl" placeholder="Paste long URL e.g. https://google.com" />
<button onclick="shorten()">Shorten</button>
<div id="result"></div>
<script>
async function shorten(){
  const longUrl = document.getElementById('longUrl').value;
  const res = await fetch('/api/shorten', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ longUrl })
  });
  const data = await res.json();
  document.getElementById('result').innerHTML = res.ok 
    ? `<a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`
    : data.error;
}
</script>
</body>
</html>
